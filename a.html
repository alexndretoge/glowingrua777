<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

const GameContext = createContext(null);

// ============ AUDIO ============
function useAudio() {
  const audioCtxRef = useRef(null);
  useEffect(() => {
    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
  }, []);
  const playTone = useCallback((freq, duration, type = 'sine', volume = 0.2) => {
    if (!audioCtxRef.current) return;
    try {
      const osc = audioCtxRef.current.createOscillator();
      const gain = audioCtxRef.current.createGain();
      osc.connect(gain); gain.connect(audioCtxRef.current.destination);
      osc.frequency.value = freq; osc.type = type;
      gain.gain.setValueAtTime(volume, audioCtxRef.current.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtxRef.current.currentTime + duration);
      osc.start(audioCtxRef.current.currentTime);
      osc.stop(audioCtxRef.current.currentTime + duration);
    } catch(e) {}
  }, []);
  const sfx = useCallback((name) => {
    switch(name) {
      case 'step': playTone(120+Math.random()*40, 0.08, 'triangle', 0.08); break;
      case 'clue': playTone(800,0.12);setTimeout(()=>playTone(1200,0.18),80);setTimeout(()=>playTone(1600,0.25),180); break;
      case 'echo': playTone(300,0.6,'sine',0.15);setTimeout(()=>playTone(500,0.6,'sine',0.15),150);setTimeout(()=>playTone(800,0.8,'sine',0.15),350); break;
      case 'dialogue': playTone(280+Math.random()*80,0.04,'square',0.04); break;
      case 'choice': playTone(500,0.08);setTimeout(()=>playTone(700,0.12),60); break;
      case 'tension': playTone(80,1.2,'sawtooth',0.12); break;
      case 'heartbeat': playTone(60,0.15,'sine',0.25);setTimeout(()=>playTone(60,0.15,'sine',0.25),200); break;
      case 'interact': playTone(600,0.1);setTimeout(()=>playTone(800,0.15),80); break;
    }
  }, [playTone]);
  return { sfx };
}

// ============ INPUT ============
function useInput() {
  const keysRef = useRef({});
  useEffect(() => {
    const down = (e) => { keysRef.current[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); };
    const up = (e) => { keysRef.current[e.key.toLowerCase()] = false; };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
  }, []);
  return keysRef;
}

// ============ PARTICLE ============
class Particle {
  constructor(x, y, color, opt = {}) {
    this.x = x; this.y = y;
    this.vx = opt.vx !== undefined ? opt.vx : (Math.random()-0.5)*5;
    this.vy = opt.vy !== undefined ? opt.vy : (Math.random()-0.5)*5;
    this.ax = opt.ax || 0; this.ay = opt.ay || 0.08;
    this.friction = opt.friction || 0.98;
    this.life = 1; this.decay = opt.decay || 0.015;
    this.color = color;
    this.size = opt.size || (Math.random()*4+2);
    this.maxSize = this.size;
    this.shape = opt.shape || 'circle';
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random()-0.5)*0.2;
    this.glow = opt.glow || false;
    this.trail = opt.trail || false;
    this.trailPoints = [];
  }
  update() {
    if (this.trail) { this.trailPoints.push({x:this.x,y:this.y,life:this.life}); if(this.trailPoints.length>8)this.trailPoints.shift(); }
    this.vx += this.ax; this.vy += this.ay;
    this.vx *= this.friction; this.vy *= this.friction;
    this.x += this.vx; this.y += this.vy;
    this.rotation += this.rotSpeed;
    this.life -= this.decay;
    this.size = this.maxSize * Math.max(0, this.life);
  }
  draw(ctx) {
    if (this.life <= 0) return;
    if (this.trail && this.trailPoints.length > 1) {
      for (let i = 0; i < this.trailPoints.length - 1; i++) {
        const p = this.trailPoints[i], n = this.trailPoints[i+1];
        ctx.strokeStyle = this.color; ctx.globalAlpha = (i/this.trailPoints.length)*this.life*0.4;
        ctx.lineWidth = this.size * 0.4;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(n.x,n.y); ctx.stroke();
      }
    }
    ctx.globalAlpha = this.life;
    if (this.glow) { ctx.shadowBlur = 15; ctx.shadowColor = this.color; }
    ctx.fillStyle = this.color;
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
    if (this.shape === 'circle') { ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fill(); }
    else if (this.shape === 'star') { drawStar(ctx,0,0,5,this.size,this.size/2); }
    else if (this.shape === 'square') { ctx.fillRect(-this.size/2,-this.size/2,this.size,this.size); }
    ctx.restore();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

function drawStar(ctx, cx, cy, spikes, outer, inner) {
  let rot = Math.PI/2*3; const step = Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx, cy-outer);
  for (let i = 0; i < spikes; i++) {
    let x = cx + Math.cos(rot)*outer, y = cy + Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx + Math.cos(rot)*inner; y = cy + Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer); ctx.closePath(); ctx.fill();
}

// ============ GAME CANVAS ============
function GameCanvas({ gameState, keysRef, sfx, emitRef, nilaPosRef, onInteract, onEcho }) {
  const canvasRef = useRef(null);
  const stateRef = useRef({
    particles: [],
    trailParticles: [],
    bgParticles: [],
    frameCount: 0,
    cameraX: 0,
    nila: {
      x: 200, y: 500, width: 36, height: 72,
      vx: 0, vy: 0, accel: 0.6, maxSpeed: 4.5, runSpeed: 7, friction: 0.82,
      facing: 1, animFrame: 0, isWalking: false, isRunning: false
    }
  });
  
  useEffect(() => {
    stateRef.current.bgParticles = [];
    for (let i = 0; i < 80; i++) {
      stateRef.current.bgParticles.push({
        x: Math.random()*1280, y: Math.random()*720,
        size: Math.random()*2.5+0.5,
        vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
        opacity: Math.random()*0.4+0.1,
        color: ['#8a6bbf','#00f0ff','#d4af37'][Math.floor(Math.random()*3)],
        phase: Math.random()*Math.PI*2
      });
    }
  }, []);
  
  useEffect(() => {
    emitRef.current = (x, y, color, count, opt = {}) => {
      for (let i = 0; i < count; i++) {
        stateRef.current.particles.push(new Particle(x, y, color, {
          ...opt,
          vx: opt.vx !== undefined ? opt.vx + (Math.random()-0.5)*2 : (Math.random()-0.5)*6,
          vy: opt.vy !== undefined ? opt.vy + (Math.random()-0.5)*2 : (Math.random()-0.5)*6
        }));
      }
    };
  }, []);
  
  useEffect(() => {
    if (gameState.currentScene && SCENES[gameState.currentScene]) {
      const scene = SCENES[gameState.currentScene];
      stateRef.current.nila.x = scene.nilaStart.x;
      stateRef.current.nila.y = scene.nilaStart.y;
      stateRef.current.nila.vx = 0;
      stateRef.current.nila.vy = 0;
      stateRef.current.particles = [];
      stateRef.current.trailParticles = [];
      emitRef.current(640, 360, '#d4af37', 60, {shape:'star',glow:true,trail:true,size:5,decay:0.008,gravity:false,vx:0,vy:0});
    }
  }, [gameState.currentScene]);
  
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId;
    
    const loop = () => {
      const s = stateRef.current;
      s.frameCount++;
      
      if (gameState.canMove && !gameState.dialogueActive) {
        const keys = keysRef.current;
        let inputX = 0, inputY = 0;
        if (keys['a'] || keys['arrowleft']) inputX = -1;
        if (keys['d'] || keys['arrowright']) inputX = 1;
        if (keys['w'] || keys['arrowup']) inputY = -1;
        if (keys['s'] || keys['arrowdown']) inputY = 1;
        if (inputX !== 0 && inputY !== 0) { inputX *= 0.707; inputY *= 0.707; }
        
        s.nila.isRunning = keys['shift'];
        const maxSpd = s.nila.isRunning ? s.nila.runSpeed : s.nila.maxSpeed;
        
        if (inputX !== 0) {
          s.nila.vx += inputX * s.nila.accel;
          s.nila.vx = Math.max(-maxSpd, Math.min(maxSpd, s.nila.vx));
          s.nila.facing = inputX > 0 ? 1 : -1;
        } else {
          s.nila.vx *= s.nila.friction;
          if (Math.abs(s.nila.vx) < 0.1) s.nila.vx = 0;
        }
        if (inputY !== 0) {
          s.nila.vy += inputY * s.nila.accel;
          s.nila.vy = Math.max(-maxSpd, Math.min(maxSpd, s.nila.vy));
        } else {
          s.nila.vy *= s.nila.friction;
          if (Math.abs(s.nila.vy) < 0.1) s.nila.vy = 0;
        }
        
        s.nila.x += s.nila.vx;
        s.nila.y += s.nila.vy;
        
        const scene = SCENES[gameState.currentScene];
        const maxX = scene ? scene.width - 50 : 1230;
        s.nila.x = Math.max(20, Math.min(maxX, s.nila.x));
        s.nila.y = Math.max(300, Math.min(620, s.nila.y));
        
        s.nila.isWalking = Math.abs(s.nila.vx) > 0.3 || Math.abs(s.nila.vy) > 0.3;
        if (s.nila.isWalking) {
          s.nila.animFrame += s.nila.isRunning ? 0.25 : 0.15;
          if (s.frameCount % 12 === 0) sfx('step');
          if (s.frameCount % 2 === 0) {
            s.trailParticles.push(new Particle(s.nila.x + 18, s.nila.y + s.nila.height, '#8a6bbf', {
              vx: (Math.random()-0.5)*0.5, vy: -Math.random()*0.5-0.3,
              size: Math.random()*2+1, life: 0.6, decay: 0.02, glow: true, shape: 'circle', gravity: false, friction: 0.99
            }));
          }
        }
        
        if (scene) {
          const targetX = Math.max(0, Math.min(scene.width - 1280, s.nila.x - 640));
          s.cameraX += (targetX - s.cameraX) * 0.08;
        }
        
        nilaPosRef.current = { x: s.nila.x, y: s.nila.y };
      }
      
      s.particles = s.particles.filter(p => { p.update(); return p.life > 0; });
      s.trailParticles = s.trailParticles.filter(p => { p.update(); return p.life > 0; });
      s.bgParticles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.phase += 0.02;
        if (p.x < 0) p.x = 1280; if (p.x > 1280) p.x = 0;
        if (p.y < 0) p.y = 720; if (p.y > 720) p.y = 0;
      });
      
      if (gameState.echoMode && s.frameCount % 3 === 0) {
        s.particles.push(new Particle(Math.random()*1280, Math.random()*720, '#00f0ff', {
          vx: (Math.random()-0.5)*0.5, vy: -Math.random()*0.5-0.2,
          size: Math.random()*2+1, life: 1, decay: 0.008, glow: true, shape: 'circle', gravity: false, friction: 0.99
        }));
      }
      
      ctx.clearRect(0, 0, 1280, 720);
      
      s.bgParticles.forEach(p => {
        ctx.globalAlpha = p.opacity * (0.5 + Math.sin(p.phase)*0.5);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8; ctx.shadowColor = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
      });
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      
      const scene = SCENES[gameState.currentScene];
      if (scene) {
        ctx.save();
        ctx.translate(-s.cameraX, 0);
        drawSceneBackground(ctx, gameState.currentScene, s.frameCount);
        ctx.restore();
        
        scene.objects.forEach(obj => {
          if (obj.echoOnly && !gameState.echoMode) return;
          drawObject(ctx, obj, s.cameraX, s.frameCount);
        });
        
        scene.npcs.forEach(npc => {
          if (npc.echoOnly && !gameState.echoMode) return;
          drawNPC(ctx, npc, s.cameraX, s.frameCount);
        });
      }
      
      s.trailParticles.forEach(p => p.draw(ctx));
      drawNila(ctx, s.nila, s.cameraX, s.frameCount, gameState.echoMode);
      s.particles.forEach(p => p.draw(ctx));
      
      if (gameState.echoMode) {
        ctx.fillStyle = 'rgba(0,50,150,0.08)';
        ctx.fillRect(0, 0, 1280, 720);
        ctx.fillStyle = 'rgba(0,240,255,0.03)';
        for (let i = 0; i < 720; i += 4) ctx.fillRect(0, i, 1280, 2);
      }
      
      const vig = ctx.createRadialGradient(640, 360, 200, 640, 360, 700);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, 1280, 720);
      
      if (!gameState.dialogueActive && gameState.canMove && scene) {
        let target = null;
        for (let npc of scene.npcs) {
          if (npc.echoOnly && !gameState.echoMode) continue;
          const dist = Math.hypot(s.nila.x - (npc.x+20), s.nila.y - (npc.y+40));
          if (dist < 80) { target = {x: npc.x - s.cameraX + 20, y: npc.y - 30, text: '[E] ' + npc.name}; break; }
        }
        if (!target) {
          for (let obj of scene.objects) {
            if (obj.echoOnly && !gameState.echoMode) continue;
            const dist = Math.hypot(s.nila.x - (obj.x+obj.w/2), s.nila.y - (obj.y+obj.h/2));
            if (dist < 80) { target = {x: obj.x - s.cameraX + obj.w/2, y: obj.y - 20, text: '[E] ' + obj.name}; break; }
          }
        }
        if (target) {
          ctx.fillStyle = 'rgba(212,175,55,0.95)';
          ctx.font = 'bold 14px Inter'; ctx.textAlign = 'center';
          ctx.shadowBlur = 10; ctx.shadowColor = '#d4af37';
          ctx.fillText(target.text, target.x, target.y);
          ctx.shadowBlur = 0; ctx.textAlign = 'left';
        }
      }
      
      animId = requestAnimationFrame(loop);
    };
    
    loop();
    return () => cancelAnimationFrame(animId);
  }, [gameState.currentScene, gameState.canMove, gameState.dialogueActive, gameState.echoMode, keysRef, sfx]);
  
  return <canvas ref={canvasRef} className="game-canvas" width={1280} height={720} />;
}

function drawObject(ctx, obj, camX, frame) {
  const x = obj.x - camX, y = obj.y;
  const pulse = Math.sin(frame*0.1)*0.3+0.7;
  if (obj.type === 'clue') {
    ctx.fillStyle = `rgba(212,175,55,${0.2*pulse})`;
    ctx.beginPath(); ctx.arc(x+obj.w/2,y+obj.h/2,40,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d4af37'; ctx.shadowBlur = 15*pulse; ctx.shadowColor = '#d4af37';
    if (obj.id === 'paper') {
      ctx.fillStyle = '#f0f0e0'; ctx.fillRect(x,y,obj.w,obj.h);
      ctx.fillStyle = '#333'; ctx.font = '6px monospace'; ctx.fillText('???',x+5,y+15);
    } else if (obj.id === 'letter') {
      ctx.fillStyle = '#f0e0c0'; ctx.fillRect(x,y,obj.w,obj.h);
      ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 1; ctx.strokeRect(x,y,obj.w,obj.h);
    } else if (obj.id === 'memorial_table') {
      ctx.fillStyle = '#6a5a4a'; ctx.fillRect(x,y,obj.w,obj.h);
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(x+10,y+10,25,30); ctx.fillRect(x+45,y+10,25,30); ctx.fillRect(x+80,y+10,25,30);
      ctx.fillStyle = '#ff6b6b';
      [20,55,90].forEach(fx => { ctx.beginPath(); ctx.arc(x+fx,y+5,6,0,Math.PI*2); ctx.fill(); });
    } else if (obj.id === 'echo_desk') {
      ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x,y,obj.w,obj.h);
      ctx.fillStyle = '#f0f0e0';
      for (let i = 0; i < 5; i++) ctx.fillRect(x+10+i*28,y+15,20,25);
    }
    ctx.shadowBlur = 0;
  } else if (obj.type === 'trigger' || obj.type === 'npc_trigger') {
    if (obj.id.includes('door')) {
      ctx.fillStyle = '#6a3a1a'; ctx.fillRect(x,y,obj.w,obj.h);
      ctx.fillStyle = '#d4af37'; ctx.beginPath(); ctx.arc(x+obj.w-15,y+obj.h/2,4,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawNPC(ctx, npc, camX, frame) {
  const x = npc.x - camX, y = npc.y;
  ctx.save(); ctx.translate(x+20, y+40);
  const bounce = Math.sin(frame*0.05+npc.x)*1.5;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0,36,18,5,0,0,Math.PI*2); ctx.fill();
  let bodyColor = '#4a4a5a', hairColor = '#3a3a3a';
  switch(npc.id) {
    case 'anderson': case 'anderson_arrival': case 'anderson_dinner': case 'anderson_final': case 'echo_anderson':
      bodyColor = '#2a2a3a'; hairColor = '#3a3a3a'; break;
    case 'nina': case 'nina_dinner': bodyColor = '#8a4a6a'; hairColor = '#5a3020'; break;
    case 'izabel': case 'izabel_walk': case 'izabel_scared': bodyColor = '#4a6a8a'; hairColor = '#2a1a1a'; break;
    case 'diretor': bodyColor = '#3a3a4a'; hairColor = '#4a4a4a'; break;
    case 'thalyta': bodyColor = '#6a4a4a'; hairColor = '#2a1a1a'; break;
    case 'echo_perteson': bodyColor = '#1a1a2a'; hairColor = '#1a1a1a'; break;
  }
  if (npc.echoOnly) { ctx.globalAlpha = 0.7; ctx.shadowBlur = 20; ctx.shadowColor = '#00f0ff'; }
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-10,20,8,22); ctx.fillRect(2,20,8,22);
  const bodyGrad = ctx.createLinearGradient(-15,-10,15,20);
  bodyGrad.addColorStop(0,bodyColor); bodyGrad.addColorStop(1,lighten(bodyColor,30));
  ctx.fillStyle = bodyGrad; ctx.fillRect(-15,-10+bounce,30,35);
  ctx.fillStyle = '#f0d0b0'; ctx.beginPath(); ctx.arc(0,-18+bounce,13,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = hairColor; ctx.beginPath(); ctx.arc(0,-21+bounce,15,Math.PI,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(-5,-19+bounce,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-19+bounce,2.5,0,Math.PI*2); ctx.fill();
  if (npc.emotion === 'suspicious' || npc.emotion === 'cold' || npc.emotion === 'angry') {
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-8,-22+bounce); ctx.lineTo(-2,-21+bounce); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,-22+bounce); ctx.lineTo(2,-21+bounce); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(212,175,55,0.9)'; ctx.font = '12px Inter'; ctx.textAlign = 'center';
  ctx.fillText(npc.name, 0, -45); ctx.textAlign = 'left';
  ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.restore();
}

function drawNila(ctx, nila, camX, frame, echoMode) {
  const x = nila.x - camX, y = nila.y;
  ctx.save(); ctx.translate(x+nila.width/2, y+nila.height/2); ctx.scale(nila.facing, 1);
  const bounce = nila.isWalking ? Math.sin(nila.animFrame)*3 : Math.sin(frame*0.05)*1;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0,36,18,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a2a4a';
  const legOff = nila.isWalking ? Math.sin(nila.animFrame)*6 : 0;
  ctx.fillRect(-10,20,8,22+legOff); ctx.fillRect(2,20,8,22-legOff);
  const bodyGrad = ctx.createLinearGradient(-15,-10,15,20);
  bodyGrad.addColorStop(0,'#6a4c93'); bodyGrad.addColorStop(1,'#8a6bbf');
  ctx.fillStyle = bodyGrad; ctx.fillRect(-15,-10+bounce,30,35);
  ctx.fillStyle = '#5a3c83';
  const armSwing = nila.isWalking ? Math.sin(nila.animFrame)*15 : 0;
  ctx.save(); ctx.translate(-15,-5+bounce); ctx.rotate(armSwing*Math.PI/180);
  ctx.fillRect(-4,0,8,25); ctx.restore();
  ctx.save(); ctx.translate(15,-5+bounce); ctx.rotate(-armSwing*Math.PI/180);
  ctx.fillRect(-4,0,8,25); ctx.restore();
  ctx.fillStyle = '#f0d0b0'; ctx.beginPath(); ctx.arc(0,-18+bounce,13,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a3060'; ctx.beginPath(); ctx.arc(0,-21+bounce,15,Math.PI,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#6a4c93'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const angle = Math.PI + (i/5)*Math.PI;
    const flow = Math.sin(frame*0.08+i)*3;
    const len = 12 + flow;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle)*15, -21+bounce+Math.sin(angle)*15);
    ctx.lineTo(Math.cos(angle)*(15+len), -21+bounce+Math.sin(angle)*(15+len));
    ctx.stroke();
  }
  ctx.fillStyle = '#00f0ff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00f0ff';
  ctx.beginPath(); ctx.arc(5,-19+bounce,3,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#8b6b4a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(3,-12+bounce); ctx.lineTo(7,-12+bounce); ctx.stroke();
  if (echoMode) {
    ctx.strokeStyle = 'rgba(0,240,255,0.6)'; ctx.lineWidth = 2;
    ctx.shadowBlur = 15; ctx.shadowColor = '#00f0ff';
    ctx.beginPath(); ctx.arc(0,0,40+Math.sin(frame*0.1)*3,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function lighten(c, a) {
  const n = parseInt(c.replace('#',''), 16);
  const r = Math.min(255, (n>>16)+a);
  const g = Math.min(255, ((n>>8)&0xff)+a);
  const b = Math.min(255, (n&0xff)+a);
  return `rgb(${r},${g},${b})`;
}

  const showNotification = useCallback((msg) => {
    setNotification(msg);
    setTimeout(() => setNotification(null), 3500);
  }, []);
  
  const showChapterTitle = useCallback((num, text) => {
    setChapterTitle({num, text});
    setTimeout(() => setChapterTitle(null), 4000);
  }, []);
  
  const showInteractionHint = useCallback((text) => {
    setInteractionHint(text);
    setTimeout(() => setInteractionHint(null), 3000);
  }, []);
  
  const typeText = useCallback((fullText, callback) => {
    setIsTyping(true);
    setDialogueText('');
    let i = 0;
    if (typingIntervalRef.current) clearInterval(typingIntervalRef.current);
    typingIntervalRef.current = setInterval(() => {
      if (i < fullText.length) {
        setDialogueText(prev => prev + fullText[i]);
        if (i % 3 === 0) sfx('dialogue');
        i++;
      } else {
        clearInterval(typingIntervalRef.current);
        typingIntervalRef.current = null;
        setIsTyping(false);
        if (callback) callback();
      }
    }, 25);
  }, [sfx]);
  
  const changeScene = useCallback((sceneName) => {
    if (!SCENES[sceneName]) return;
    setCurrentScene(sceneName);
    const scene = SCENES[sceneName];
    showChapterTitle(`Capítulo ${scene.chapter}`, scene.name);
    
    if (scene.forceEcho) {
      setEchoMode(true);
      sfx('echo');
    }
    
    setTimeout(() => {
      if (scene.introDialogue) {
        const cb = scene.showDinnerChoice ? () => showDinnerChoice() : 
                   scene.showFinalChoice ? () => showFinalChoice() : null;
        startDialogue(scene.introDialogue, cb);
      } else if (scene.showDinnerChoice) {
        setTimeout(() => showDinnerChoice(), 500);
      } else if (scene.showFinalChoice) {
        setTimeout(() => showFinalChoice(), 500);
      }
    }, 1500);
  }, [sfx, showChapterTitle]);
  
  const startDialogue = useCallback((lines, callback = null) => {
    setCurrentDialogue(lines);
    setDialogueIndex(0);
    setDialogueChoices(null);
    setDialogueActive(true);
    setCanMove(false);
    dialogueCallbackRef.current = callback;
    
    if (lines[0]) {
      typeText(lines[0].t);
    }
  }, [typeText]);
  
  const advanceDialogue = useCallback(() => {
    if (!currentDialogue) return;
    if (dialogueChoices) return;
    
    if (isTyping) {
      if (typingIntervalRef.current) {
        clearInterval(typingIntervalRef.current);
        typingIntervalRef.current = null;
      }
      setDialogueText(currentDialogue[dialogueIndex].t);
      setIsTyping(false);
      return;
    }
    
    const nextIndex = dialogueIndex + 1;
    if (nextIndex >= currentDialogue.length) {
      setDialogueActive(false);
      setCurrentDialogue(null);
      setDialogueIndex(0);
      setDialogueText('');
      if (dialogueCallbackRef.current) {
        const cb = dialogueCallbackRef.current;
        dialogueCallbackRef.current = null;
        cb();
      } else {
        setCanMove(true);
      }
    } else {
      setDialogueIndex(nextIndex);
      typeText(currentDialogue[nextIndex].t);
    }
  }, [currentDialogue, dialogueIndex, dialogueChoices, isTyping, typeText]);
  
  const showDinnerChoice = useCallback(() => {
    setDialogueChoices([
      {
        text: '🔍 "Pai, você conhece o investigador Perteson? Vi um homem parecido com ele do seu lado na prefeitura."',
        effect: 'Suspeita +25%',
        action: () => {
          setSuspicion(s => Math.min(100, s + 25));
          setChoicesMade(c => [...c, 'direct_question']);
          sfx('tension');
          startDialogue([
            {s:'Anderson',t:'...Ah, o Perteson. Sim, ele cuida da segurança da cidade.'},
            {s:'Anderson',t:'O diretor só quis ser cuidadoso, filha. Não se preocupe.'},
            {s:'Nina',t:'E você, Nila, gostou da comida?'},
            {s:'',t:'(O clima ficou tenso. Seu pai está escondendo algo.)',narration:true}
          ], afterDinner);
        }
      },
      {
        text: '😊 "Foi um dia normal, nada demais. A comida está ótima, mãe."',
        effect: 'Suspeita +0%',
        action: () => {
          setChoicesMade(c => [...c, 'pretend_normal']);
          startDialogue([
            {s:'Anderson',t:'Que bom, filha! Me conta mais sobre a escola amanhã.'},
            {s:'Nina',t:'Fico feliz! Vou lavar os pratos, pode ir pro quarto.'}
          ], afterDinner);
        }
      },
      {
        text: '😰 "Izabel me contou sobre o dia 6 de novembro... sobre os desaparecimentos."',
        effect: 'Suspeita +40% | Confiança -10',
        action: () => {
          setSuspicion(s => Math.min(100, s + 40));
          setTrust(t => Math.max(0, t - 10));
          setChoicesMade(c => [...c, 'confront_early']);
          sfx('tension'); sfx('heartbeat');
          startDialogue([
            {s:'',t:'O garfo do seu pai para no ar. O sorriso desaparece.',narration:true},
            {s:'Anderson',t:'...Onde você ouviu isso, Nila?'},
            {s:'Anderson',t:'Escute. Essas coisas são apenas boatos.'},
            {s:'Nina',t:'Anderson, calma... Nila, vai pro quarto, querida.'},
            {s:'',t:'(Seus pais estão com medo. Eles sabem de algo...)',narration:true}
          ], afterDinner);
        }
      }
    ]);
  }, [sfx, startDialogue]);
  
  const showFinalChoice = useCallback(() => {
    setDialogueChoices([
      {
        text: '💔 "Eu vou te denunciar. Você vai pagar pelo que fez."',
        effect: 'Final: Justiça',
        action: () => { setEnding('justice'); setChoicesMade(c => [...c, 'denounce']); }
      },
      {
        text: '😢 "Por que, pai? Por que você fez isso?"',
        effect: 'Final: Confronto Emocional',
        action: () => { setEnding('emotional'); setChoicesMade(c => [...c, 'confront_emotional']); }
      },
      {
        text: '🤫 "Eu vou guardar seu segredo. Mas você me deve uma."',
        effect: 'Final: Cumplicidade',
        action: () => { setEnding('accomplice'); setChoicesMade(c => [...c, 'protect']); }
      }
    ]);
  }, []);
  
  const afterDinner = useCallback(() => {
    setTimeout(() => {
      if (suspicion >= 60 || choicesMade.includes('confront_early')) {
        changeScene('confrontation');
      } else {
        startDialogue([
          {s:'',t:'Nila vai pro quarto. Mas não consegue dormir.',narration:true},
          {s:'',t:'Ela pensa em tudo que aconteceu. Em Izabel. No pai. No 6 de novembro.',narration:true},
          {s:'Nila',t:'(Pensando) Preciso ver com meus próprios olhos. Preciso voltar à prefeitura.'},
          {s:'',t:'Ela espera todos dormirem. E sai.',narration:true}
        ], () => changeScene('echo_prefeitura'));
      }
    }, 500);
  }, [suspicion, choicesMade, changeScene, startDialogue]);
  
  const handleChoice = useCallback((choice) => {
    setDialogueChoices(null);
    choice.action();
  }, []);
  
  const handleInteract = useCallback(() => {
    if (dialogueActive || !canMove) return;
    const scene = SCENES[currentScene];
    if (!scene) return;
    
    const nila = nilaPosRef.current;
    
    for (let npc of scene.npcs) {
      if (npc.echoOnly && !echoMode) continue;
      const dist = Math.hypot(nila.x - (npc.x+20), nila.y - (npc.y+40));
      if (dist < 80 && npc.dialogue && DIALOGUES[npc.dialogue]) {
        sfx('interact');
        startDialogue(DIALOGUES[npc.dialogue]);
        return;
      }
    }
    
    for (let obj of scene.objects) {
      if (obj.echoOnly && !echoMode) continue;
      const dist = Math.hypot(nila.x - (obj.x+obj.w/2), nila.y - (obj.y+obj.h/2));
      if (dist < 80) {
        sfx('interact');
        if (obj.type === 'clue' && obj.clue && !clues.includes(obj.clue)) {
          setClues(c => [...c, obj.clue]);
          showNotification('📋 Nova pista: ' + obj.name);
          sfx('clue');
          if (emitRef.current) {
            emitRef.current(obj.x+obj.w/2, obj.y+obj.h/2, '#d4af37', 40, {shape:'star',glow:true,trail:true,size:5,decay:0.01});
          }
        }
        if (obj.dialogue) {
          if (Array.isArray(obj.dialogue)) startDialogue(obj.dialogue);
          else if (DIALOGUES[obj.dialogue]) startDialogue(DIALOGUES[obj.dialogue]);
        } else if (obj.nextScene) {
          changeScene(obj.nextScene);
        }
        return;
      }
    }
    
    showInteractionHint('Aproxime-se mais para interagir');
  }, [dialogueActive, canMove, currentScene, echoMode, clues, sfx, startDialogue, changeScene, showNotification, showInteractionHint]);
  
  const toggleEcho = useCallback(() => {
    if (dialogueActive || currentScene === 'echo_prefeitura') return;
    setEchoMode(e => !e);
    sfx('echo');
  }, [dialogueActive, currentScene, sfx]);
  
  useEffect(() => {
    const handleKey = (e) => {
      if (e.key === ' ' && dialogueActive) {
        e.preventDefault();
        advanceDialogue();
      }
      if (e.key.toLowerCase() === 'q') toggleEcho();
      if (e.key.toLowerCase() === 'e' && canMove && !dialogueActive) handleInteract();
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [dialogueActive, advanceDialogue, toggleEcho, canMove, handleInteract]);
  
  const handleStart = useCallback(() => {
    setGameStarted(true);
    setShowTutorial(true);
  }, []);
  
  const handleTutorialComplete = useCallback(() => {
    setShowTutorial(false);
    changeScene('home_arrival');
  }, [changeScene]);
  
  const handleRestart = useCallback(() => {
    window.location.reload();
  }, []);
  
  const contextValue = useMemo(() => ({ sfx }), [sfx]);
  
  const currentLine = currentDialogue && currentDialogue[dialogueIndex] ? currentDialogue[dialogueIndex] : null;
  
  return (
    <GameContext.Provider value={contextValue}>
      <div className="game-wrapper">
        <GameCanvas 
          gameState={gameState} 
          keysRef={keysRef} 
          sfx={sfx}
          emitRef={emitRef}
          nilaPosRef={nilaPosRef}
          onInteract={handleInteract}
          onEcho={toggleEcho}
        />
        
        <div className="ui-layer">
          {!gameStarted && <TitleScreen onStart={handleStart} />}
          
          {gameStarted && showTutorial && <Tutorial onComplete={handleTutorialComplete} />}
          
          {gameStarted && !showTutorial && !ending && (
            <>
              <HUD 
                clues={clues} 
                trust={trust} 
                suspicion={suspicion} 
                chapter={SCENES[currentScene]?.name || ''} 
                visible={gameStarted}
              />
              <EchoIndicator active={echoMode} />
              <Notification message={notification} />
              {chapterTitle && <ChapterTitle num={chapterTitle.num} text={chapterTitle.text} />}
              <ControlsBar visible={gameStarted} />
              <InteractionHint text={interactionHint} />
              
              {dialogueActive && currentLine && (
                <DialogueBox
                  speaker={currentLine.s || 'Nila'}
                  text={dialogueText}
                  narration={currentLine.narration}
                  highlight={currentLine.highlight}
                  onAdvance={advanceDialogue}
                  choices={dialogueChoices}
                  onChoice={handleChoice}
                  isTyping={isTyping}
                />
              )}
            </>
          )}
          
          {ending && (
            <EndScreen
              ending={ending}
              clues={clues}
              trust={trust}
              suspicion={suspicion}
              choicesMade={choicesMade}
              onRestart={handleRestart}
            />
          )}
        </div>
      </div>
    </GameContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
